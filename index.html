<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d5c45">
<title>Mi Negocio Rentable</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Plan: celular primero; una columna; tres acciones grandes arriba; barra de navegación abajo.
   Verde de mercado = dinero y acción principal; ámbar reishi = voz y alertas suaves. */
:root {
  --bg: #f4f5f2; --surface: #ffffff; --ink: #17201c; --muted: #5d6963; --line: #dfe3dd;
  --accent: #0d5c45; --accent-ink: #ffffff; --accent-soft: #e2f0ea;
  --reishi: #a3461b; --reishi-soft: #f8e9e1;
  --ok: #1a7f4b; --warn: #a86400; --warn-soft: #fff2d9; --bad: #b3261e; --bad-soft: #fce8e6; --info: #1f5fa8; --info-soft: #e5eefa;
  --font-display: "Bricolage Grotesque", "Segoe UI", Roboto, sans-serif;
  --font-body: "Figtree", "Segoe UI", Roboto, Arial, sans-serif;
  --r: 14px; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1412; --surface: #18201c; --ink: #e8eeea; --muted: #9aa8a1; --line: #2a3530;
    --accent: #3fbf8f; --accent-ink: #062a1e; --accent-soft: #163a2d; --reishi: #e48a5c; --reishi-soft: #3a2218;
    --ok: #4cc287; --warn: #f0b04a; --warn-soft: #3a2c10; --bad: #f2867d; --bad-soft: #3d1a17; --info: #7fb2ef; --info-soft: #172a40; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1412; --surface: #18201c; --ink: #e8eeea; --muted: #9aa8a1; --line: #2a3530;
  --accent: #3fbf8f; --accent-ink: #062a1e; --accent-soft: #163a2d; --reishi: #e48a5c; --reishi-soft: #3a2218;
  --ok: #4cc287; --warn: #f0b04a; --warn-soft: #3a2c10; --bad: #f2867d; --bad-soft: #3d1a17; --info: #7fb2ef; --info-soft: #172a40; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font-body); -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: 1.5rem; font-weight: 800; } h2 { font-size: 1.25rem; font-weight: 800; } h3 { font-size: 1.05rem; font-weight: 600; }
.num, td.n, .tile b { font-variant-numeric: tabular-nums; }
#app { max-width: 560px; margin: 0 auto; min-height: 100%; padding: calc(12px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.top small { color: var(--muted); display: block; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.muted { color: var(--muted); } .small { font-size: .875rem; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .between { justify-content: space-between; } .grow { flex: 1 1 0; min-width: 0; }
.big3 { display: grid; grid-template-columns: 1fr; gap: 10px; }
.big { display: flex; align-items: center; gap: 14px; min-height: 84px; border: 0; border-radius: 18px; padding: 14px 18px; font-size: 1.3rem; font-weight: 700; text-align: left; cursor: pointer; }
.big svg { width: 40px; height: 40px; flex: none; }
.big span small { display: block; font-size: .85rem; font-weight: 500; opacity: .85; }
.big.voz { background: var(--reishi); color: #fff; } .big.foto { background: var(--accent); color: var(--accent-ink); } .big.cierre { background: var(--surface); color: var(--ink); border: 2px solid var(--ink); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; min-height: 48px; font-weight: 600; cursor: pointer; }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.voz { background: var(--reishi); color: #fff; border-color: var(--reishi); }
.btn.peligro { color: var(--bad); border-color: var(--bad); }
.btn.lg { font-size: 1.15rem; min-height: 58px; flex: 1 1 0; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--info); outline-offset: 2px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.tile span { display: block; color: var(--muted); font-size: .8rem; } .tile b { font-size: 1.15rem; }
.tile.key { background: var(--accent-soft); border-color: transparent; } .tile.full { grid-column: 1 / -1; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: .78rem; font-weight: 700; background: var(--bg); border: 1px solid var(--line); white-space: nowrap; }
.chip.venta { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.compra { background: var(--info-soft); color: var(--info); border-color: transparent; }
.chip.gasto { background: var(--reishi-soft); color: var(--reishi); border-color: transparent; }
.chip.cobro { background: var(--accent-soft); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; } .chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.alerta { border-left: 5px solid var(--warn); background: var(--warn-soft); padding: 10px 12px; border-radius: 10px; }
.alerta.bad { border-color: var(--bad); background: var(--bad-soft); } .alerta.info { border-color: var(--info); background: var(--info-soft); } .alerta.ok { border-color: var(--ok); background: var(--accent-soft); }
label { font-size: .85rem; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
input, select, textarea { border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; background: var(--bg); min-height: 48px; width: 100%; font-size: 1rem; color: var(--ink); }
textarea { min-height: 70px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .grid3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; } .seg button { flex: 1 1 auto; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px; min-height: 46px; font-weight: 600; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chat { display: flex; flex-direction: column; gap: 8px; }
.burbuja { max-width: 88%; padding: 10px 13px; border-radius: 14px; } .burbuja.asist { background: var(--surface); border: 1px solid var(--line); align-self: flex-start; }
.burbuja.user { background: var(--reishi-soft); align-self: flex-end; } .burbuja.parcial { opacity: .65; font-style: italic; }
.resumen { border: 2px solid var(--ink); }
.resumen table { width: 100%; border-collapse: collapse; } .resumen td { padding: 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; } td.n { text-align: right; white-space: nowrap; padding-left: 8px; }
.total { display: flex; justify-content: space-between; font-family: var(--font-display); font-size: 1.35rem; font-weight: 800; }
.pregunta { font-family: var(--font-display); font-size: 1.2rem; font-weight: 800; text-align: center; }
.lista { display: flex; flex-direction: column; } .item { display: flex; gap: 10px; justify-content: space-between; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; } .item.anulada { opacity: .55; } .item.anulada .det { text-decoration: line-through; }
.tablewrap { overflow-x: auto; } table.k { border-collapse: collapse; width: 100%; font-size: .85rem; } table.k th, table.k td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; } table.k th:first-child, table.k td:first-child { text-align: left; }
nav.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
nav.bar div { display: grid; grid-template-columns: repeat(5, 1fr); width: 100%; max-width: 560px; }
nav.bar button { border: 0; background: none; padding: 8px 2px 10px; min-height: 62px; font-size: .74rem; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
nav.bar button svg { width: 24px; height: 24px; } nav.bar button[aria-current="page"] { color: var(--accent); }
.mic { width: 96px; height: 96px; border-radius: 50%; border: 0; background: var(--reishi); color: #fff; display: grid; place-items: center; margin: 0 auto; cursor: pointer; }
.mic svg { width: 44px; height: 44px; } .mic.on { animation: pulso 1.2s infinite; }
@keyframes pulso { 0% { box-shadow: 0 0 0 0 rgba(163, 70, 27, .55); } 100% { box-shadow: 0 0 0 26px rgba(163, 70, 27, 0); } }
@media (prefers-reduced-motion: reduce) { .mic.on { animation: none; outline: 4px solid var(--reishi-soft); } }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
.modal > div { background: var(--surface); width: 100%; max-width: 560px; max-height: 90%; overflow: auto; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom)); background: var(--ink); color: var(--surface); padding: 11px 16px; border-radius: 12px; font-weight: 600; z-index: 20; max-width: 92%; display: none; }
.foto-prev { max-width: 100%; max-height: 260px; object-fit: contain; border-radius: 10px; border: 1px solid var(--line); align-self: center; }
.demo { background: var(--warn); color: #fff; text-align: center; font-weight: 700; padding: 6px; border-radius: 10px; font-size: .9rem; }
.ilegible { background: var(--warn-soft); color: var(--warn); font-weight: 700; padding: 0 6px; border-radius: 6px; }
@media (max-width: 380px) { .grid3 { grid-template-columns: 1fr 1fr; } .grid3 > :first-child { grid-column: 1 / -1; } .big { font-size: 1.15rem; } }
</style>
</head>
<body>
<div id="app"><div class="card"><h2>Mi Negocio Rentable</h2><p class="muted">Cargando tu negocio…</p></div></div>
<nav class="bar" id="nav" hidden></nav>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/plataforma.js"></script>
<script src="js/core.js"></script>
<script src="js/app.js"></script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
